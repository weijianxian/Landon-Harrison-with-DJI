[project]
name = "bird-dji"
version = "0.1.0"
description = "Render a game-style drone HUD from DJI SRT telemetry"
readme = "README.md"
authors = [
    { name = "柠檬味氨水", email = "33548986+weijianxian@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "Pillow>=11.0",
    "fire>=0.7.1",
    "opencv-python-headless>=4.10",
]

[project.optional-dependencies]
pose = ["ultralytics>=8.3"]

[project.scripts]
bird-dji = "bird_dji:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
